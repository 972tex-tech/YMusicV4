// Packaging config for Hydraulic Conveyor (https://conveyor.hydraulic.dev) — builds signed,
// self-updating installers for macOS/Windows/Linux from ONE machine. Free for open-source
// projects like this one.
//
//   conveyor make site            # every package + the update site, into output/
//   conveyor make mac-app         # just the macOS app (fast iteration)
//   conveyor make copied-site     # build + upload, once app.site is configured
//
// The compose-desktop `packageReleaseDmg` path still works and is unaffected by this file.

// The app's main class and JVM options, exported live from the Gradle build — which also builds
// the shrunk jars app.inputs points at below. -Pymusic.debugLogs=false is the release knob (see
// DEBUG_BUILD): every Conveyor package is a release build by construction.
include required("#!./conveyor-config.sh")

// The JVM that ships inside every package. 17 is what the app targets and what the
// jpackage-built DMG has been verified with.
include required("/stdlib/jdk/17/openjdk.conf")

// Required companion to app.jvm.extract-native-libraries below: sets the system properties that
// libraries which unpack their own natives (JNA above all) need once the files are already on
// disk — e.g. jna.nosys=false.
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

app {
  // The Gradle export carries compose's packageName ("YMusic"); Conveyor wants kebab-case here
  // (it names files and the Linux package). The user-visible name is display-name.
  fsname = ymusic
  display-name = YMusic
  rdns-name = io.ymusic.desktop
  vendor = "Khang NT"

  // TODO: replace with a >=1024px icon before a public release — this is the in-app logo
  // (192px); Conveyor upscales it, which looks soft on macOS where 1024px is used.
  icons = commonUi/src/commonMain/composeResources/drawable/ymusic_logo.png

  machines = [ mac.amd64, mac.aarch64, windows.amd64, linux.amd64.glibc ]

  // REPLACES the raw dependency-classpath list the Gradle plugin exported above with the
  // ProGuard-shrunk one (:desktopApp:conveyorJars). Assignment, not +=, is the point.
  inputs = [ desktopApp/build/conveyorJars ]

  // Unpacks native libs out of the jars into the JVM lib dir and DROPS the ones for other
  // platforms — sqlite-jdbc alone ships every OS/arch. (strip-debug-info stays off on purpose:
  // it would remove the line numbers Sentry needs to map a stack trace to source.)
  jvm.extract-native-libraries = true

  // Reflection/ServiceLoader reach these, so jdeps bytecode scanning can miss them:
  // java.sql (sqlite-jdbc + DriverManager), jdk.unsupported (Unsafe — JNA/vlcj/coroutines/okio),
  // java.management + java.logging (Sentry, JNA), jdk.crypto.ec (TLS for the CEF download).
  jvm.modules += java.sql
  jvm.modules += java.management
  jvm.modules += java.logging
  jvm.modules += jdk.unsupported
  jvm.modules += jdk.crypto.ec

  mac.info-plist {
    // JCEF/Chromium keys (from Hydraulic's jcef-conveyor sample).
    NSSupportsAutomaticGraphicsSwitching = true
    NSHighResolutionCapable = true
    LSEnvironment.MallocNanoZone = "0"
  }

  // Update site. A localhost URL keeps builds on the free tier (no license key) — packages
  // built this way check for updates at localhost, which is fine for local testing. Once the
  // public repo exists, replace this with:
  //   vcs-url = github.com/<user>/<repo>       // derives site.base-url = .../releases/latest/download
  //   site.github.oauth-token = ${env.GITHUB_TOKEN}
  //   site.github.pages-branch = gh-pages      // hosts the generated download page
  site.base-url = "localhost:8899"
}

// CEF (~150MB of Chromium) is NOT bundled here: jcefmaven downloads it on first run into
// ~/.ymusic/jcef-bundle, so packages stay small. To bundle it instead — required once the app is
// notarized, because a hardened runtime refuses to load unsigned dylibs — follow
// github.com/hydraulic-software/jcef-conveyor (per-machine `zip:` inputs + Frameworks
// bundle-extras + an install.lock file) and point CefManager's setInstallDir at the bundled path.

conveyor.compatibility-level = 22
