// Hydraulic Conveyor packaging: `conveyor make site` builds the packages + update site.

// Builds the shrunk jars app.inputs points at, then prints the Gradle-exported config.
include required("#!./conveyor-config.sh")

// The JVM bundled into every package; 17 is the app's target.
include required("/stdlib/jdk/17/openjdk.conf")

// Companion to app.jvm.extract-native-libraries: the system properties libraries need to find
// natives already on disk (jna.nosys=false and friends). Vendored from Hydraulic's repo (Apache
// licensed) rather than included by URL — an unpinned fetch off master would let an upstream edit
// change our build.
include required("conveyor-extract-native-libraries.conf")

app {
  // Kebab-case required (names files and the Linux package); the Gradle export sends "YMusic".
  fsname = ymusic
  display-name = YMusic
  rdns-name = io.ymusic.desktop
  vendor = "Khang NT"

  // TODO: replace with a >=1024px icon before a public release — this is the in-app logo
  // (192px); Conveyor upscales it, which looks soft on macOS where 1024px is used.
  icons = commonUi/src/commonMain/composeResources/drawable/ymusic_logo.png

  // ONLY the build host's platform. :quickjs compiles libquickjsjni per host (CMake), so its jar
  // carries jni/<host>/ alone — any other package would die at System.load, and the engine is not
  // optional. Adding a platform means producing its native there (a CI matrix, one runner per OS)
  // and merging the jars first; Conveyor itself is happy to build all four.
  machines = [ mac.amd64 ]

  // Assignment, not +=: replaces the raw classpath the plugin exported with the shrunk jars.
  inputs = [ desktopApp/build/conveyorJars ]

  // Extracts natives to the JVM lib dir, dropping other platforms'. strip-debug-info stays off:
  // it removes the line numbers Sentry needs.
  jvm.extract-native-libraries = true

  // Reflection/ServiceLoader reach these, so jdeps bytecode scanning can miss them:
  // java.sql (sqlite-jdbc + DriverManager), jdk.unsupported (Unsafe — JNA/vlcj/coroutines/okio),
  // java.management + java.logging (Sentry, JNA), jdk.crypto.ec (TLS for the CEF download).
  jvm.modules += java.sql
  jvm.modules += java.management
  jvm.modules += java.logging
  jvm.modules += jdk.unsupported
  jvm.modules += jdk.crypto.ec

  // Pinned because Conveyor's default rotation includes ubuntu-ports, which serves ARM only —
  // no amd64 index is found there and the whole site build fails.
  linux.debian.distributions = [
    { name = "noble", mirrors = ["http://archive.ubuntu.com/ubuntu/"] }
  ]

  mac.info-plist {
    // JCEF/Chromium keys (from Hydraulic's jcef-conveyor sample).
    NSSupportsAutomaticGraphicsSwitching = true
    NSHighResolutionCapable = true
    LSEnvironment.MallocNanoZone = "0"
  }

  // localhost keeps builds on the free tier (no license key). Once the public repo exists:
  //   vcs-url = github.com/<user>/<repo>       // derives site.base-url = .../releases/latest/download
  //   site.github.oauth-token = ${env.GITHUB_TOKEN}
  //   site.github.pages-branch = gh-pages      // hosts the generated download page
  site.base-url = "localhost:8899"
}

// CEF is not bundled — jcefmaven downloads it on first run. Bundling becomes REQUIRED once the
// app is notarized (a hardened runtime won't load unsigned dylibs): see
// github.com/hydraulic-software/jcef-conveyor, and point CefManager's setInstallDir at it.

conveyor.compatibility-level = 22
