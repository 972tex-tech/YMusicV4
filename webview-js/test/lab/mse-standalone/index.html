<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>blank-splice MSE lab</title></head>
<body>
<video id="v" muted autoplay playsinline width="320" height="180"></video>
<pre id="log"></pre>
<script src="blank_webm.js"></script>
<script>
// Standalone proof for the audio-only blank-splice design:
//  E1 spliceBlank(): stop real video appends, append blank clusters -> playback must continue.
//  E2 resumeReal(): re-append real init + remaining clusters -> video returns seamlessly.
//  E3 seek into a blank region.
var v = document.getElementById('v');
var events = [];
function rec(ev, detail) {
  var e = { t: performance.now() / 1000, ev: ev };
  if (detail) for (var k in detail) e[k] = detail[k];
  events.push(e);
  console.log('[lab]', JSON.stringify(e));
}
['playing','waiting','stalled','seeking','seeked','error','ended'].forEach(function (n) {
  v.addEventListener(n, function () { rec('video.' + n, { ct: v.currentTime, rs: v.readyState }); });
});

function fmtRanges(b) {
  var out = [];
  for (var i = 0; i < b.length; i++) out.push(b.start(i).toFixed(2) + '-' + b.end(i).toFixed(2));
  return out.join(',');
}

var ms, sbA, sbV, realV, realA;
var clusterOffsets = []; // [byteOffset, timecodeMs]

// Scan webm bytes for Cluster elements (0x1F43B675) and their Timecode.
function scanClusters(u8) {
  var res = [];
  for (var i = 0; i < u8.length - 4; i++) {
    if (u8[i] === 0x1f && u8[i+1] === 0x43 && u8[i+2] === 0xb6 && u8[i+3] === 0x75) {
      // read timecode element (0xE7) shortly after size vint
      var t = -1;
      for (var j = i + 4; j < Math.min(i + 24, u8.length - 2); j++) {
        if (u8[j] === 0xe7) {
          var sz = u8[j+1] & 0x7f;
          t = 0;
          for (var k = 0; k < sz; k++) t = t * 256 + u8[j+2+k];
          break;
        }
      }
      res.push([i, t]);
    }
  }
  return res;
}

function append(sb, data) {
  return new Promise(function (resolve, reject) {
    function done() { sb.removeEventListener('updateend', done); resolve(); }
    sb.addEventListener('updateend', done);
    try { sb.appendBuffer(data); } catch (e) { rec('appendError', { msg: '' + e }); reject(e); }
  });
}

window.setup = async function () {
  realV = new Uint8Array(await (await fetch('real_v.webm')).arrayBuffer());
  realA = new Uint8Array(await (await fetch('real_a.webm')).arrayBuffer());
  clusterOffsets = scanClusters(realV);
  rec('assets', { v: realV.length, a: realA.length, clusters: clusterOffsets.length, firstT: clusterOffsets[0] && clusterOffsets[0][1] });
  ms = new MediaSource();
  v.src = URL.createObjectURL(ms);
  await new Promise(function (r) { ms.addEventListener('sourceopen', r, { once: true }); });
  sbA = ms.addSourceBuffer('audio/webm; codecs="opus"');
  sbV = ms.addSourceBuffer('video/webm; codecs="vp9"');
  await append(sbA, realA); // all audio upfront
  // Video: init + clusters up to ~30s only ("streaming" that stops).
  var cut = realV.length;
  for (var i = 0; i < clusterOffsets.length; i++) {
    if (clusterOffsets[i][1] > 30000) { cut = clusterOffsets[i][0]; break; }
  }
  window.__cutOffset = cut;
  await append(sbV, realV.subarray(0, cut));
  ms.duration = 90;
  rec('setupDone', { aBuf: fmtRanges(sbA.buffered), vBuf: fmtRanges(sbV.buffered) });
  v.play();
  return 'ok';
};

// E1: splice to blank from current buffered end to 90s.
window.spliceBlank = async function () {
  var from = sbV.buffered.length ? sbV.buffered.end(sbV.buffered.length - 1) : v.currentTime;
  var init = window.blankWebm.buildInit(90000);
  var clusters = window.blankWebm.buildClusters(Math.floor(from * 1000) - 1000, 90000, 10000);
  rec('spliceBlank', { from: from, initBytes: init.length, clusterBytes: clusters.length });
  await append(sbV, init);
  await append(sbV, clusters);
  rec('spliceDone', { vBuf: fmtRanges(sbV.buffered) });
  return 'ok';
};

// E2: resume real video from ~currentTime: re-append real init + clusters from the keyframe
// cluster at/before target.
window.resumeReal = async function () {
  var target = v.currentTime;
  var startIdx = 0;
  for (var i = 0; i < clusterOffsets.length; i++) {
    if (clusterOffsets[i][1] / 1000 <= target) startIdx = i; else break;
  }
  var initEnd = clusterOffsets[0][0];
  rec('resumeReal', { target: target, fromClusterT: clusterOffsets[startIdx][1] });
  await append(sbV, realV.subarray(0, initEnd));                 // real init segment
  await append(sbV, realV.subarray(clusterOffsets[startIdx][0])); // clusters from keyframe
  rec('resumeDone', { vBuf: fmtRanges(sbV.buffered) });
  return 'ok';
};

window.snap = function () {
  return JSON.stringify({
    ct: v.currentTime, rs: v.readyState, paused: v.paused, vw: v.videoWidth,
    a: sbA ? fmtRanges(sbA.buffered) : '', vb: sbV ? fmtRanges(sbV.buffered) : '',
    waits: events.filter(function (e) { return e.ev === 'video.waiting'; }).length,
    errs: events.filter(function (e) { return e.ev === 'video.error' || e.ev === 'appendError'; }).length,
  });
};
</script>
</body>
</html>
