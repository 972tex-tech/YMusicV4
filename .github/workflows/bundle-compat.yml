name: bundle-compat

# Today's production engine.js / player.js against the host of every shipped tag from
# compat/floor.txt on, one concurrent job per tag (compat/README.md).
on:
  pull_request:
    paths: ['engine-js/**', 'quickjs/native/**', 'mse/native/**', 'dynamic-engine/**', 'compat/**', 'buildSrc/**', '.github/workflows/bundle-compat.yml']
  push:
    branches: [public-master]
    paths: ['engine-js/**', 'quickjs/native/**', 'mse/native/**', 'dynamic-engine/**', 'compat/**', 'buildSrc/**', '.github/workflows/bundle-compat.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundles:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the tags
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew -Pproduction=true :engine-js:closureJs :engine-js:closurePlayerJs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles
          path: |
            engine-js/build/dist/engine.js
            engine-js/build/dist/player.js
          if-no-files-found: error
      - id: tags
        run: echo "tags=$(compat/tags.sh --json)" >> "$GITHUB_OUTPUT"

  host:
    needs: bundles
    if: needs.bundles.outputs.tags != '[]'
    name: host ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.bundles.outputs.tags) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.tag }}
          path: host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundles
          path: bundles
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: head/compat/overlay.sh host bundles
      - working-directory: host
        run: ./gradlew :dynamic-engine:jvmTest --tests 'io.ymusic.dynamicengine.compat.*' --rerun
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ matrix.tag }}
          path: host/dynamic-engine/build/reports/tests/jvmTest
