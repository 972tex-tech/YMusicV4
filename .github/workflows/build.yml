name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ffmpeg-build commit the apps link against. Bumping it rebuilds every ffmpeg pack once;
  # otherwise each pack comes from the cache keyed on this ref.
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: e38cb40412b6da2d789e77dad4117299a08cddfc

jobs:
  # The checkouts sit side by side (YMusicV4/ + ffmpeg-build/): the Gradle build reads
  # ../ffmpeg-build/out/<slug>, exactly as on a developer machine.
  ffmpeg:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: android-arm64-v8a, runner: ubuntu-24.04 }
          - { slug: android-x86, runner: ubuntu-24.04 }
          - { slug: android-x86_64, runner: ubuntu-24.04 }
          - { slug: macos-arm64, runner: macos-14 }
          - { slug: macos-x86_64, runner: macos-15-intel }
    steps:
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      # Pinned, not the runner's moving ANDROID_NDK_LATEST_HOME: r28c is what the packs are known to
      # build with on every ABI.
      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'android-')
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c

      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'android-')
        working-directory: ffmpeg-build
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh "${SLUG#android-}" || {
            # A dependency's configure failure prints only its verdict; the reason is in its log.
            for log in .deps-$SLUG/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }
        env:
          SLUG: ${{ matrix.slug }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}

      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'macos-')
        working-directory: ffmpeg-build
        run: |
          brew install nasm automake autoconf libtool pkg-config meson ninja
          scripts/build-desktop.sh

  android:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    env:
      SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4

      - name: Restore ffmpeg android-arm64-v8a
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-arm64-v8a
          key: ffmpeg-android-arm64-v8a-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-x86
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-x86
          key: ffmpeg-android-x86-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-x86_64
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-x86_64
          key: ffmpeg-android-x86_64-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # The shipping build: secrets.enc → secrets.properties + signing/. Pull requests never decrypt
      # (nor does a run without SECRETS_PASSPHRASE); they build on defaults — unsigned, no Sentry
      # upload, no remote config — to prove the change compiles, not to ship.
      - name: Restore secrets
        if: env.SECRETS_PASSPHRASE != '' && github.event_name != 'pull_request'
        working-directory: YMusicV4
        run: ./decrypt.sh

      # With the decrypted sentry.auth.token the Sentry plugin uploads the ProGuard mapping and
      # source context for this build, so crashes from the shipped APKs symbolicate.
      - name: Assemble release APKs
        working-directory: YMusicV4
        run: ./gradlew :androidApp:assembleRelease

      - name: Discard secrets
        if: always()
        working-directory: YMusicV4
        run: rm -rf secrets.properties signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apks
          path: YMusicV4/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  macos:
    name: macos ${{ matrix.slug }}
    needs: ffmpeg
    runs-on: ${{ matrix.runner }}
    env:
      SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: macos-arm64, runner: macos-14 }
          - { slug: macos-x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true

      # A full JDK: jpackage builds the DMG, and the build looks for it under JAVA_HOME.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # The shipping build: secrets.enc → secrets.properties + signing/. Pull requests never decrypt
      # (nor does a run without SECRETS_PASSPHRASE); they build on defaults — unsigned, no Sentry
      # upload, no remote config — to prove the change compiles, not to ship.
      - name: Restore secrets
        if: env.SECRETS_PASSPHRASE != '' && github.event_name != 'pull_request'
        working-directory: YMusicV4
        run: ./decrypt.sh

      # The Developer ID identity (MACOS_CERT_P12, base64, + MACOS_CERT_PASSWORD from the decrypted
      # secrets.properties) goes into a throwaway keychain the build's codesign can reach.
      - name: Import signing identity
        if: hashFiles('YMusicV4/secrets.properties') != ''
        working-directory: YMusicV4
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" secrets.properties | head -n 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/cert.p12"
          prop MACOS_CERT_P12 | base64 --decode > "$CERT"
          [ -s "$CERT" ] || { echo "MACOS_CERT_P12 in secrets.properties is empty or not base64" >&2; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without this the keychain relocks mid-build and codesign waits on a UI prompt.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$(prop MACOS_CERT_PASSWORD)" -A -f pkcs12 -k "$KEYCHAIN"
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Appended: the runner's own keychains carry the Apple intermediates the chain needs.
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d ' "')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" ||
            { echo "no valid Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }

      # Signed with mac.signing.identity and notarized + stapled with the mac.notarization.* account
      # when secrets were restored; otherwise an unsigned DMG.
      - name: Package DMG
        working-directory: YMusicV4
        run: |
          if [ -f secrets.properties ]; then
            ./gradlew :desktopApp:packageReleaseDmg :desktopApp:notarizeReleaseDmg
          else
            ./gradlew :desktopApp:packageReleaseDmg
          fi

      - name: Discard secrets
        if: always()
        working-directory: YMusicV4
        run: |
          rm -rf secrets.properties signing
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.slug }}-dmg
          path: YMusicV4/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error
